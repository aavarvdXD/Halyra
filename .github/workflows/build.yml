name: Build Distributables

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install binutils
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Build Linux distributable
        run: ./gradlew :composeApp:createDistributable

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: halyra-linux
          path: composeApp/build/compose/binaries/main/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows distributable
        run: .\gradlew.bat :composeApp:createDistributable

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: halyra-windows
          path: composeApp/build/compose/binaries/main/

